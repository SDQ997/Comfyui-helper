[package]
name = "comfyui-helper"
version = "0.1.0"
description = "Lightweight ComfyUI assistant - prompt, assets, LoRA, plugins, video analysis"
authors = ["ComfyUI Helper Contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# async runtime & http
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
# config & files
toml = "0.8"
dirs = "5"
walkdir = "2"
# hashing / id
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# video metadata & thumbnails (system ffmpeg/ffprobe)
serde_urlencoded = "0.7"
regex = "1"
# git operations for plugin management
git2 = { version = "0.19", default-features = false, features = ["https"] }
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
